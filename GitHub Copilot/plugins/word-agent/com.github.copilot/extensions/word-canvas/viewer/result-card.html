<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--color-text-primary, CanvasText); background: transparent; }
    .card {
      overflow: hidden;
      border: 1px solid var(--color-border-secondary, color-mix(in srgb, CanvasText 18%, transparent));
      border-radius: var(--border-radius-lg, 12px);
      background: var(--color-background-primary, Canvas);
      box-shadow: var(--shadow-sm, 0 2px 8px rgb(0 0 0 / 10%));
    }
    .preview {
      position: relative;
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #2b579a, #4b78c2);
    }
    .preview img { width: 100%; height: 100%; object-fit: cover; }
    .word { font-size: clamp(36px, 12vw, 72px); font-weight: 700; color: white; }
    .body { padding: 14px; }
    .eyebrow { color: var(--color-text-secondary, GrayText); font-size: 12px; font-weight: 600; }
    h2 { margin: 4px 0 14px; overflow: hidden; font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      min-height: 32px;
      padding: 6px 12px;
      border: 1px solid var(--color-border-primary, color-mix(in srgb, CanvasText 24%, transparent));
      border-radius: var(--border-radius-md, 8px);
      color: var(--color-text-primary, CanvasText);
      background: var(--color-background-secondary, ButtonFace);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { border-color: #2b579a; color: white; background: #2b579a; }
    button:disabled { cursor: default; opacity: .55; }
    .status { margin-top: 10px; color: var(--color-text-secondary, GrayText); font-size: 12px; }
  </style>
</head>
<body>
  <article class="card">
    <div class="preview" id="preview"><span class="word">W</span></div>
    <div class="body">
      <div class="eyebrow">Word document</div>
      <h2 id="title">Preparing document…</h2>
      <div class="actions">
        <button class="primary" id="previewButton" disabled>Open in Copilot</button>
        <button id="linkButton" disabled>Open in Word</button>
      </div>
      <div class="status" id="status">Waiting for Word to finish…</div>
    </div>
  </article>
  <script>
    (() => {
      const pending = new Map();
      let nextId = 1;
      let artifact;

      function request(method, params) {
        const id = nextId++;
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
      }

      function notify(method, params) {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      }

      function findDocument(result) {
        const direct = result?.structuredContent?.wordDocument;
        if (direct?.artifactUrl) return direct;
        for (const item of result?.content || []) {
          if (item?.type !== "text") continue;
          const match = item.text.match(/https:\/\/[^\s"'<>]+/);
          if (match) return { artifactUrl: match[0].replace(/[),.;]+$/, ""), title: "Word document" };
        }
      }

      async function render(value) {
        artifact = value;
        document.getElementById("title").textContent = value.title || "Word document";
        document.getElementById("status").textContent = "Ready to preview or edit";
        for (const id of ["previewButton", "linkButton"]) {
          document.getElementById(id).disabled = false;
        }
        try {
          const dataResult = await request("tools/call", {
            name: "word_card_data",
            arguments: { artifactUrl: value.artifactUrl, title: value.title }
          });
          const data = dataResult?.structuredContent || {};
          if (data.fileName) document.getElementById("title").textContent = data.fileName;
          if (data.thumbnailDataUri) {
            const image = document.createElement("img");
            image.src = data.thumbnailDataUri;
            image.alt = "Document preview";
            document.getElementById("preview").replaceChildren(image);
          }
        } catch {
          document.getElementById("status").textContent = "Document ready";
        }
      }

      window.addEventListener("message", async (event) => {
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.id !== undefined && pending.has(message.id)) {
          const handler = pending.get(message.id);
          pending.delete(message.id);
          message.error ? handler.reject(message.error) : handler.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result") {
          const value = findDocument(message.params);
          if (value) await render(value);
        }
      });

      document.getElementById("previewButton").addEventListener("click", () => request("ui/message", {
        role: "user",
        content: { type: "text", text: `Reopen this document in the Word canvas using open_word_canvas with instanceId "word-document-view" and mode "view": ${artifact.artifactUrl}` }
      }));
      document.getElementById("linkButton").addEventListener("click", () => request("ui/open-link", {
        url: artifact.artifactUrl
      }));

      request("ui/initialize", {
        protocolVersion: "2026-01-26",
        capabilities: {},
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
        clientInfo: { name: "word-result-card", version: "1.0.0" }
      }).then(() => notify("ui/notifications/initialized", {}));
    })();
  </script>
</body>
</html>
