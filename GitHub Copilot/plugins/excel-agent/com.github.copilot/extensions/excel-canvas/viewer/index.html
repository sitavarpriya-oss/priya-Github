<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Excel</title>
  <style>
    html, body, #viewer { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #f3f3f3; color: #242424; font: 14px "Segoe UI", sans-serif; }
    #status { display: grid; place-items: center; position: fixed; z-index: 1; inset: 0; padding: 24px; background: #f3f3f3; text-align: center; }
    #fallback { display: none; max-width: 420px; }
    #fallback a { display: inline-block; margin-top: 12px; color: #005a9e; font-weight: 600; }
    #fallback a:not([href]) { display: none; }
    #viewer { display: block; }
    body.ready #status { display: none; }
    body.error #message { color: #a4262c; }
    body.error #status { display: grid; }
    body.error #fallback { display: block; }
    body.error #viewer { display: none; }
    body.closed #status { display: grid; }
    body.closed #viewer { display: none; }
  </style>
</head>
<body>
  <div id="status" role="status">
    <div>
      <div id="message">Preparing Excel...</div>
      <div id="fallback">
        <p>The authenticated Excel preview could not start in this canvas.</p>
        <a id="open-workbook" target="_blank" rel="noreferrer">Open workbook in Excel</a>
      </div>
    </div>
  </div>
  <main id="viewer" aria-label="Excel workbook"></main>
  <script src="/viewer/viewer.bundle.js"></script>
</body>
</html>
